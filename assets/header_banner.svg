<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#12101d"/>
      <stop offset="100%" stop-color="#0d0b16"/>
    </linearGradient>

    <!-- Glowing Backdrop Radial -->
    <radialGradient id="glow-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#703ee5" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#703ee5" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="75%" stop-color="#703ee5"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#703ee5" stop-opacity="0"/>
      <stop offset="30%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#703ee5" stop-opacity="0"/>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#703ee5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 58px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: 0.5px;
      fill: #cbd5e1;
    }
    .sparkle {
      animation: pulse 3s infinite ease-in-out;
    }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="220" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Tech Grid -->
  <rect width="1200" height="220" rx="16" fill="url(#grid)"/>

  <!-- Radial Glow Behind Text -->
  <ellipse cx="600" cy="110" rx="450" ry="90" fill="url(#glow-radial)"/>

  <!-- Decorative Top & Bottom Border Glow Lines -->
  <rect x="150" y="0" width="900" height="2" fill="url(#line-grad)"/>
  <rect x="250" y="218" width="700" height="2" fill="url(#line-grad)"/>

  <!-- Ambient Stars/Particles -->
  <circle cx="180" cy="50" r="1.5" fill="#a855f7" opacity="0.6"/>
  <circle cx="240" cy="160" r="2" fill="#c084fc" opacity="0.8"/>
  <circle cx="350" cy="40" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="420" cy="180" r="1.5" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="780" cy="35" r="2" fill="#a855f7" opacity="0.7"/>
  <circle cx="880" cy="175" r="1.5" fill="#c084fc" opacity="0.6"/>
  <circle cx="990" cy="60" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="1040" cy="150" r="2" fill="#8b5cf6" opacity="0.7"/>

  <!-- Main Title with Glow -->
  <g filter="url(#glow)">
    <text x="600" y="105" text-anchor="middle" fill="url(#text-grad)" class="title">StrawVerse</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="152" text-anchor="middle" class="subtitle">The Modern Anime &amp; Manga Desktop Experience</text>

  <!-- Decorative Sleek Side Accents -->
  <path d="M 120 110 L 220 110" stroke="url(#line-grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="220" cy="110" r="3" fill="#a855f7"/>

  <path d="M 1080 110 L 980 110" stroke="url(#line-grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="980" cy="110" r="3" fill="#a855f7"/>
</svg>
