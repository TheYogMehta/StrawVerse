# Toggle fullscreen on double left click
MBTN_LEFT_DBL cycle fullscreen

# Disable right click actions completely
MBTN_RIGHT ignore
MBTN_RIGHT_DBL ignore

# Disable Tab focus navigation (keyboard shortcuts handled separately)
TAB ignore

# Map arrow up/down to volume controls instead of default seek
UP add volume 2
DOWN add volume -2

# Standard Left/Right arrow keys for 5s seeking
LEFT seek -5
RIGHT seek 5

# YouTube/Netflix style J (rewind 10s), K (play/pause), L (fast forward 10s)
j seek -10
k cycle pause
l seek 10

# Playback Speed adjustment (> increases by 0.25x, < decreases by 0.25x)
> add speed 0.25
< add speed -0.25

# YouTube style number keys for percentage seeking (0% to 90%)
0 seek 0 absolute-percent
1 seek 10 absolute-percent
2 seek 20 absolute-percent
3 seek 30 absolute-percent
4 seek 40 absolute-percent
5 seek 50 absolute-percent
6 seek 60 absolute-percent
7 seek 70 absolute-percent
8 seek 80 absolute-percent
9 seek 90 absolute-percent

# Subtitle controls (C toggles visibility, V cycles tracks, Shift+V cycles backward)
c cycle sub-visibility
v cycle sub
V cycle sub down


