changelog:
  - "[11.2.2]"
  - "**Indexed title lookups**: Every title search in the MAL catalogue (30,818 anime / 87,315 manga rows) was a full table scan. An expression index turns those scans into index lookups — the Manga Discover page dropped from ~2,060 ms to ~1,374 ms, Anime from ~933 ms to ~788 ms"
  - "**Same title, same anime — always**: The catalogue contains thousands of duplicate titles (\"minna no uta\" appears 709 times), so the old lookup picked a random one and could show a different MAL id on every run. The winner is now picked deterministically: the entry the mapping server actually linked first, then the shortest title, then the lowest MAL id"
  - "**Provider links are learned now**: The mapping server ships no provider link tables, so a MAL id could never be traced back to a provider. Cards that resolve to exactly one MAL entry are now remembered locally (provider id → MAL id), which makes \"find the source for this MAL id\" and \"find the MAL id for this card\" work again — e.g. episodes for an anime you already have"
  - "**Your own links are never overwritten**: Learned links only fill gaps; a link you made yourself always wins"
  - "**Much faster Discover on Android**: The Discover list no longer asks the database once per card — a page of 24 cards used to run ~200 separate lookups, each one a slow Java-bridge round trip on Android. The lookups are now batched, so a page loads in a fraction of the time (Anime page 1: ~206 calls → 17; Manga: ~198 → 19) with identical results"
  - "**Discover cards keep their badges**: The batched lookup preserves the old per-card behaviour exactly (same MAL id, image, genres and airing status on every card)"
  - "**Download resilience**: If a subtitle/dub category has no working servers (hardsub-only episodes), the downloader falls back to the opposite category, then to unfiltered servers, instead of failing after 3 retries"
  - "**Soft subtitles on download**: Downloads prefer soft-sub servers over hardsub (burned-in) sources when you pick \"sub\", so subtitles are never painted into the video frames"
  - "**Filter panel collapse**: Caret arrow (^) on the filter panel header collapses/expands the filter grid"
  - "**Filters start collapsed**: The Discover/Filters panel now opens collapsed by default; the caret expands it"
  - "**Discover keeps your place**: Switching sections (e.g. Downloads to Discover) restores the list, page, scroll position and filters you were last seeing; re-tapping the active nav icon still refreshes"
  - "**Back to Anime button**: The Downloads header now has a Back button (top-right) that returns to the anime page or Discover list you were last viewing"
  - "**Missing SUB/DUB badges fixed**: Discover cards whose AnimeKai id had gone stale (the site rotates its URL slugs) now heal to the fresh id and retry, so language badges load instead of failing with 404 \"detail page unreachable\""
  - "**Language badges on every card**: Cards with a MAL id no longer lose SUB/DUB when the mapping has no row for your provider — languages now read straight from the card's own provider page (the episode list was always reachable, only the MAL-id lookup failed)"
  - "**AniList blip tolerance**: A rate-limit (429) from AniList now retries once after 2 s instead of failing the whole status batch, which could leave airing/complete badges missing for the session"
  - "**Log rotation fixed**: Only the 3 newest session logs are kept - older logs are now deleted at startup (previously the folder settled at 4 files)"
  - "**Faster filter badges**: Badge metadata loads after applying filters with a 250 ms debounce, bulk fetch of 48 items, and duplicate-fetch caching"
  - "**Anikoto speed**: Provider metadata cache keys use the provider name (fixes cache misses vs the official anikoto build)"
  - "**Quieter Android logs**: Native HTTP fallback warning only prints when BOTH the native bridge and the Node fallback fail (was spamming on every routine fallback)"
  - "**Mapping sync fix**: One broken provider table returning HTTP 500 no longer aborts the whole mapping sync — core tables (anime/manga) now sync even when a provider table fails"
  - "**Faster startup**: Auto-update check deferred 8s; image-cache cleanup batches deletes; snapshot apply removes 80k+ per-row queries"
  - "**repo enable/disable**: Toggle extension repositories on/off; disabled repos hide but installed items remain"
  - "**Discover provider switcher**: Provider picker left of Anime/Manga toggle; clears caches, reloads page 1"
  - "**Description copy button**: Copy full raw text (strips `[more]`)"
  - "**Plex & Jellyfin section**: Dedicated settings before Subtitle Customization & Appearance"
  - "**Info page seasons**: Now includes OVA, MOVIE, and SPECIAL formats (not just TV series)"
  - "**Changelog merge**: Merged upstream [11.2.1] entries ([manga reader overhaul](https://github.com/TheYogMehta/StrawVerse/releases/tag/v11.2.1), [mapping/Manga schema fixes](https://github.com/TheYogMehta/StrawVerse/releases/tag/v11.2.0))"
  - "**Fixed Android bugs**: Browse button dead (missing `Swal` import), provider picker hidden (gate relaxed `> 1` → `>= 1`)"
  - "**Version continues as 11.2.2** above upstream's 11.2.1"
